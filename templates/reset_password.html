{% extends "base.html" %}
{% block title %}Reset Password | GEC Hostel Management{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow border-0"><div class="card-header bg-primary text-white text-center py-3"><h3 class="mb-0">Set New Password</h3></div><div class="card-body p-4">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required></div><div class="mb-3"><label class="form-label">Confirm new password</label><input class="form-control" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary w-100" type="submit">Reset Password</button></form></div></div></div></div></div>
{% endblock %}
